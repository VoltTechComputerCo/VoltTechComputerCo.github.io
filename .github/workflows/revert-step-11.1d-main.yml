name: Revert accidental Step 11.1D main upload

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/revert-step-11.1d-main.yml"

permissions:
  contents: write

concurrency:
  group: revert-step-11.1d-main
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Guard exact accidental state
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT="46c9bb4d2629ece292f687b522a286085b964225"
          RESTORE_SHA="64e551f865a76af6b3190b17c334c0dc2c603bd0"
          PARENT="$(git rev-parse HEAD^)"

          if [ "$PARENT" != "$EXPECTED_PARENT" ]; then
            echo "ABORT: main moved before revert. Expected workflow parent $EXPECTED_PARENT, found $PARENT"
            exit 1
          fi

          mapfile -t UPLOAD_DIFF < <(git diff --name-only HEAD^..HEAD)
          if [ "${#UPLOAD_DIFF[@]}" -ne 1 ] || [ "${UPLOAD_DIFF[0]}" != ".github/workflows/revert-step-11.1d-main.yml" ]; then
            echo "ABORT: workflow upload commit changed unexpected files:"
            printf '%s\n' "${UPLOAD_DIFF[@]}"
            exit 1
          fi

          mapfile -t ACCIDENTAL < <(git diff --name-only "$RESTORE_SHA"..HEAD^ | sort)
          EXPECTED=(
            ".github/workflows/seo-url-normalization.yml"
            "README.md"
            "docs/clean-rebuild/ROADMAP.md"
            "docs/clean-rebuild/step-11.1d-QA.md"
            "docs/clean-rebuild/step-11.1d-manifest.json"
            "scripts/normalize-public-urls.py"
            "scripts/run-step-11.1d.mjs"
            "scripts/test-public-url-contract.mjs"
          )
          mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | sort)

          if [ "$(printf '%s\n' "${ACCIDENTAL[@]}")" != "$(printf '%s\n' "${EXPECTED_SORTED[@]}")" ]; then
            echo "ABORT: accidental diff no longer matches reviewed scope."
            echo "Actual:"
            printf '%s\n' "${ACCIDENTAL[@]}"
            exit 1
          fi

      - name: Restore exact released production tree
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_SHA="64e551f865a76af6b3190b17c334c0dc2c603bd0"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git read-tree --reset -u "${RESTORE_SHA}^{tree}"

          if git diff --cached --quiet; then
            echo "Nothing to revert."
            exit 0
          fi

          git commit -m "revert: remove accidental Step 11.1D uploads from main"
          git push origin HEAD:main

      - name: Verify restored tree
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_SHA="64e551f865a76af6b3190b17c334c0dc2c603bd0"
          git fetch origin main:refs/remotes/origin/main --force

          RESTORE_TREE="$(git rev-parse "${RESTORE_SHA}^{tree}")"
          MAIN_TREE="$(git rev-parse origin/main^{tree})"

          if [ "$MAIN_TREE" != "$RESTORE_TREE" ]; then
            echo "FAIL: main tree does not match released production tree."
            exit 1
          fi

          echo "PASS: main tree restored exactly to released production state."
