name: VoltTech Step 11.2N Custom Menu Images

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2n-custom-menu-images.mjs"

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2N
        run: python3 scripts/apply-step-11.2n-custom-menu-images.py

      - name: Verify Step 11.2N contract
        run: node scripts/test-step-11.2n-custom-menu-images.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc

      - name: Guard Step 11.2N scope
        shell: python
        run: |
          import subprocess, sys
          changed = sorted(set(
              subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
              + subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).splitlines()
          ))
          allowed = {"assets/css/navigation.css"}
          unexpected = [p for p in changed if p not in allowed]
          if unexpected:
              print("Unexpected changed files:")
              print("\n".join(unexpected))
              sys.exit(1)
          if changed != ["assets/css/navigation.css"]:
              print("Expected only assets/css/navigation.css")
              print(changed)
              sys.exit(1)
          print("PASS: scope confirmed")

      - name: Commit certified Step 11.2N
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/navigation.css
          git commit -m "design: swap in user-selected menu images"
          git push origin HEAD:clean-rebuild
