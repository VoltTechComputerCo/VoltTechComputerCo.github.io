name: VoltTech Step 11.1D URL Normalization

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.1d.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.1d-url-normalization
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize public SEO URLs on staging
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Normalize authoritative public URLs
        run: python3 scripts/normalize-public-urls.py

      - name: Rebuild generated clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Rebuild STATIC RSS
        run: python3 scripts/build-static-feed.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify extensionless public URL contract
        run: node scripts/test-public-url-contract.mjs

      - name: Run complete clean regression
        run: node scripts/run-full-qa.mjs

      - name: Guard normalization scope
        shell: python
        run: |
          from pathlib import Path
          import subprocess,sys

          changed=subprocess.check_output(
              ["git","diff","--name-only"],text=True
          ).splitlines()

          def allowed(p):
              path=Path(p)
              if path.parent == Path(".") and path.suffix == ".html":
                  return True
              if p.startswith("src/pages/") and p.endswith(".html"):
                  return True
              if p in {
                  "sitemap.xml",
                  "static-feed.xml",
                  "scripts/build-static-feed.py",
                  "scripts/validate-static.py",
                  "scripts/test-clean-static.mjs",
                  ".github/workflows/static-sitemap-autopilot.yml",
                  "docs/clean-rebuild/STATIC-ARTICLE-TEMPLATE.html",
                  "docs/clean-rebuild/STATIC-PUBLISHING.md",
              }:
                  return True
              return False

          unexpected=[p for p in changed if not allowed(p)]
          if unexpected:
              print("Unexpected Step 11.1D changes:")
              print("\n".join(unexpected))
              sys.exit(1)

          print(f"PASS: {len(changed)} staged normalization file(s), all inside approved scope.")
          for p in changed:
              print("-",p)

      - name: Commit normalized staging tree
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            '*.html' \
            src/pages \
            sitemap.xml \
            static-feed.xml \
            scripts/build-static-feed.py \
            scripts/validate-static.py \
            scripts/test-clean-static.mjs \
            .github/workflows/static-sitemap-autopilot.yml \
            docs/clean-rebuild/STATIC-ARTICLE-TEMPLATE.html \
            docs/clean-rebuild/STATIC-PUBLISHING.md
          git commit -m "seo: normalize public URLs to extensionless canonicals"
          git push origin HEAD:clean-rebuild

      - name: Write QA evidence
        if: always()
        shell: bash
        run: |
          mkdir -p qa-results/step-11.1d
          {
            echo "# VoltTech Step 11.1D — URL normalization"
            echo
            echo "Branch: clean-rebuild"
            echo
            echo "Target public contract: extensionless Cloudflare Pages URLs"
            echo
            echo "Production main changed: NO"
          } > qa-results/step-11.1d/summary.md

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volttech-step-11.1d-url-normalization
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30
