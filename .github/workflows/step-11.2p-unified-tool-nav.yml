name: VoltTech Step 11.2P Unified Tool Navigation

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2p-unified-tool-nav.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.2p-unified-tool-nav
  cancel-in-progress: true

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2P
        run: python3 scripts/apply-step-11.2p-unified-tool-nav.py

      - name: Rebuild clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify Step 11.2P contract
        run: node scripts/test-step-11.2p-unified-tool-nav.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc

      - name: Guard Step 11.2P scope
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted(set(tracked + untracked))

          approved = {
              "src/pages/stream-scan.html",
              "src/pages/streaming-support.html",
              "src/pages/signal-scan.html",
              "src/pages/creator-hub-south-africa.html",
              "assets/css/glass-system.css",
          }

          for config_path in Path("src/pages").glob("*.json"):
              config = json.loads(config_path.read_text())
              approved.add(config["output"])

          unexpected = [p for p in changed if p not in approved]
          if unexpected:
              print("Unexpected Step 11.2P changes:")
              print("\n".join(unexpected))
              sys.exit(1)

          required = {
              "src/pages/stream-scan.html",
              "src/pages/streaming-support.html",
              "src/pages/signal-scan.html",
              "src/pages/creator-hub-south-africa.html",
              "assets/css/glass-system.css",
              "stream-scan.html",
              "streaming-setup-south-africa.html",
              "signal-scan.html",
              "creator-hub-south-africa.html",
          }

          missing = [p for p in required if p not in changed]
          if missing:
              print("Required Step 11.2P files did not change:")
              print("\n".join(missing))
              sys.exit(1)

          print(f"PASS: Step 11.2P scope confirmed ({len(changed)} files).")

      - name: Commit certified unified tool navigation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             src/pages/stream-scan.html             src/pages/streaming-support.html             src/pages/signal-scan.html             src/pages/creator-hub-south-africa.html             assets/css/glass-system.css

          git diff --name-only -- '*.html' | while read -r file; do
            [ -n "$file" ] && git add "$file"
          done

          git commit -m "design: unify creator and diagnostic tool navigation"
          git push origin HEAD:clean-rebuild
