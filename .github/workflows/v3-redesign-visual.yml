name: V3 Full Redesign Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - v3-full-redesign
    paths:
      - "assets/css/**"
      - "assets/js/**"
      - "src/**"
      - "builder/**"
      - "*.html"
      - "exposure-scan*"
      - "scripts/capture-v3-redesign.mjs"
      - ".github/workflows/v3-redesign-visual.yml"

permissions:
  contents: write

concurrency:
  group: v3-full-redesign-visual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out redesign
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local redesign
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/vt-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vt-http.log
          exit 1

      - name: Capture redesign
        run: node scripts/capture-v3-redesign.mjs

      - name: Upload redesign evidence
        uses: actions/upload-artifact@v4
        with:
          name: volttech-v3-redesign-visual
          path: qa-screenshots/redesign/
          retention-days: 30

      - name: Publish redesign review branch
        run: |
          rm -rf /tmp/vt-redesign
          cp -R qa-screenshots/redesign /tmp/vt-redesign
          git checkout --orphan v3-redesign-review-tmp
          git rm -rf .
          mkdir -p qa-screenshots/redesign
          cp -R /tmp/vt-redesign/. qa-screenshots/redesign/
          git add qa-screenshots/redesign
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V3 full redesign visual evidence"
          git branch -M v3-redesign-review
          git push --force origin v3-redesign-review
