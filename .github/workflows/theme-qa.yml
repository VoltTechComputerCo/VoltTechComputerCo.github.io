name: Theme appearance QA
on:
  push:
    branches: [main]
    paths: ['admin-invoices.html', 'assets/js/pages/admin-billing.js', 'scripts/test-admin-billing-browser.mjs', 'scripts/test-billing-document.mjs', 'assets/js/components/eft-payment.js', 'assets/js/pages/order-status.js', 'assets/js/pages/customer-document.js', 'operations-hub.js', 'operations-customers.js', 'scripts/test-customer-payment-browser.mjs', 'scripts/test-invoice-payment-browser.mjs', 'assets/css/**', 'assets/js/theme.js', '**/*.html', 'scripts/test-theme*', 'scripts/test-mobile-menu-brand.mjs', 'scripts/test-operations*', 'scripts/test-admin-eft-browser.mjs', 'scripts/test-expanded-store-browser.mjs', 'scripts/test-store-selection-browser.mjs', 'scripts/test-store-navigation-browser.mjs', 'scripts/test-shared-shell-browser.mjs', 'notifications.js', 'assets/js/services/**', 'commerce/js/**', 'assets/js/pages/store.js', 'assets/js/pages/home.js', 'assets/js/components/catalogue-view.js', 'assets/js/components/product-gallery.js', 'assets/js/components/product-summary.js', 'assets/js/pages/product.js', 'scripts/test-product-gallery-browser.mjs', 'assets/js/services/catalogue-pagination.js', '.github/workflows/theme-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appearance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-supplier-stock-email.mjs
      - run: node scripts/test-syntech-feed.mjs
      - run: node scripts/test-product-summary.mjs
      - run: node scripts/test-catalogue-load.mjs
      - run: node scripts/test-departments.mjs
      - run: node scripts/test-theme.mjs
      - run: node scripts/test-catalogue-pagination.mjs
      - run: node scripts/test-billing-document.mjs
      - run: node scripts/test-billing-delivery.mjs
      - run: node scripts/test-billing-profit.mjs
      - run: node scripts/test-daily-pricing.mjs
      - run: node scripts/test-billing-payments.mjs
      - run: npm install --no-save --package-lock=false playwright
      - name: Use runner Chrome
        run: test -x /usr/bin/google-chrome
      - name: Check EFT payment pages
        env:
          VT_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 > /tmp/theme-http.log 2>&1 &
          node scripts/test-customer-payment-browser.mjs
          node scripts/test-invoice-payment-browser.mjs
      - name: Check Operations autofill and customer workflow
        env:
          VT_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/test-admin-billing-browser.mjs
          node scripts/test-admin-eft-browser.mjs
          node scripts/test-operations-browser.mjs
          node scripts/test-operations-customer-browser.mjs
      - name: Check mobile and desktop themes
        env:
          VT_CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/test-theme-browser.mjs
          node scripts/test-mobile-menu-brand.mjs
          node scripts/test-store-selection-browser.mjs
          node scripts/test-store-navigation-browser.mjs
          node scripts/test-shared-shell-browser.mjs
          node scripts/test-theme-polish.mjs
          node scripts/test-product-gallery-browser.mjs
          node scripts/test-expanded-store-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-screenshots
          path: |
            qa-results/theme
            qa-results/billing
