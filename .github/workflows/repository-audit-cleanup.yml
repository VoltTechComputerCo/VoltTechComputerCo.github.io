name: VoltTech Repository Audit Cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/repository-audit-cleanup.py"

permissions:
  contents: write

concurrency:
  group: volttech-repository-audit-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/clean-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Verify audited base and create rollback branch
        shell: bash
        run: |
          set -euo pipefail
          AUDITED_BASE="264f34dbdb29e72d9e53f0b81169306611641091"
          WORKFLOW=".github/workflows/repository-audit-cleanup.yml"
          BACKUP="backup/clean-rebuild-pre-audit-2026-09-30"

          INTRO_COMMIT="$(git log --diff-filter=A --format=%H -- "$WORKFLOW" | tail -n 1)"
          if [ -z "$INTRO_COMMIT" ]; then
            echo "Could not locate the cleanup workflow introduction commit."
            exit 1
          fi

          PRE_PACKAGE="$(git rev-parse "${INTRO_COMMIT}^")"
          echo "Audited base: $AUDITED_BASE"
          echo "Pre-package branch state: $PRE_PACKAGE"

          if [ "$PRE_PACKAGE" != "$AUDITED_BASE" ]; then
            echo "clean-rebuild changed after the audit. Refusing destructive cleanup."
            echo "Expected $AUDITED_BASE but found $PRE_PACKAGE."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$BACKUP" >/dev/null 2>&1; then
            echo "Rollback branch already exists: $BACKUP"
          else
            git push origin "$PRE_PACKAGE:refs/heads/$BACKUP"
            echo "Created rollback branch at audited base: $BACKUP"
          fi

      - name: Apply repository cleanup
        run: python3 scripts/repository-audit-cleanup.py

      - name: Verify generated frontend
        run: python3 scripts/build-clean-frontend.py --check

      - name: Run complete regression suite
        run: node scripts/run-full-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volttech-repository-audit-qa
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove generated QA evidence from repository working tree
        if: success()
        shell: bash
        run: rm -rf qa-results

      - name: Commit audited cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi

          echo "Cleanup summary:"
          git diff --cached --stat
          git commit -m "chore: repository-wide cleanup and runtime trim"
          git push origin HEAD:clean-rebuild
