name: Verify live VoltTech store
on:
  push:
    branches: [main]
    paths: ['scripts/verify-live-store.mjs', '.github/workflows/live-store-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/verify-live-store.mjs
