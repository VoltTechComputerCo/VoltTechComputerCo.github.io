name: Refresh public Store catalogue
on:
  # 12 CDN snapshots/day instead of 96. Syntech continues its hourly :13 sync.
  # Stock/price is confirmed before payment; fewer PostgREST reads protect Free egress.
  schedule:
    - cron: '22 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-public-catalogue.mjs', 'commerce/js/store-core.js', '.github/workflows/public-catalogue.yml']
permissions:
  contents: write
concurrency:
  group: public-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-supabase-egress-budget.mjs
      - run: node scripts/build-public-catalogue.mjs
      - name: Publish public catalogue snapshot
        run: |
          git config user.name 'VoltTech catalogue refresh'
          git config user.email 'volttechcomputerco@gmail.com'
          git add assets/data/catalogue.json.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public Store product snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
