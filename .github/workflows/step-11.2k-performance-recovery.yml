name: VoltTech Step 11.2K Performance Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2k-performance-recovery.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.2k-performance-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Roll back heavy visual experiments and restore smooth glass UI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2K performance recovery
        run: python3 scripts/apply-step-11.2k-performance-recovery.py

      - name: Rebuild clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify Step 11.2K performance contract
        run: node scripts/test-step-11.2k-performance-recovery.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc
          echo "PASS: restored regression-mutated tracked QA files"

      - name: Guard Step 11.2K scope
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted(set(tracked + untracked))

          approved = {
              "src/templates/header.html",
              "src/pages/creator-hub-south-africa.html",
              "assets/css/navigation.css",
              "assets/css/responsive.css",
              "assets/css/glass-system.css",
              "assets/css/pages/creator-hub.css",
          }

          for config_path in Path("src/pages").glob("*.json"):
              config = json.loads(config_path.read_text())
              approved.add(config["output"])

          unexpected = [p for p in changed if p not in approved]
          if unexpected:
              print("Unexpected Step 11.2K changes:")
              print("\n".join(unexpected))
              sys.exit(1)

          print(f"PASS: Step 11.2K scope confirmed ({len(changed)} files).")

      - name: Commit certified performance recovery
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             src/templates/header.html             src/pages/creator-hub-south-africa.html             assets/css/navigation.css             assets/css/responsive.css             assets/css/glass-system.css             assets/css/pages/creator-hub.css

          git diff --name-only -- '*.html' | while read -r file; do
            [ -n "$file" ] && git add "$file"
          done

          git commit -m "perf: remove heavy backdrop composition layers"
          git push origin HEAD:clean-rebuild

      - name: Upload QA note
        if: always()
        shell: bash
        run: |
          mkdir -p qa-results/step-11.2k
          {
            echo "# VoltTech Step 11.2K — Performance Recovery"
            echo
            echo "- Rolls back Step 11.2I and Step 11.2J visual experiments."
            echo "- Restores the accepted Step 11.2H structure."
            echo "- Removes sitewide backdrop-filter usage from the global glass system."
            echo "- Keeps lightweight translucent gradients, borders and highlights."
            echo "- Keeps the small Step 11.2G image-overlay blur system intact."
            echo "- Removes fixed full-screen filtered photographic background."
          } > qa-results/step-11.2k/summary.md

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volttech-step-11.2k-performance-recovery
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30
