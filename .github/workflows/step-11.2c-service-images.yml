name: VoltTech Step 11.2C Service Image Replacement

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2c-service-images.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.2c-service-images
  cancel-in-progress: true

jobs:
  replace:
    name: Replace service page images and retire old assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply service image replacement
        run: python3 scripts/apply-step-11.2c-service-images.py

      - name: Rebuild clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify Step 11.2C image replacement contract
        run: node scripts/test-step-11.2c-service-images.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Guard Step 11.2C scope
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          approved_source = {
            "src/pages/service-repair.html",
            "src/pages/service-performance.html",
            "src/pages/service-upgrades.html",
            "src/pages/service-windows.html",
            "src/pages/service-security.html",
            "src/pages/streaming-support.html",
            "vt-repair.webp",
            "vt-performance.webp",
            "vt-upgrades.webp",
            "vt-windows.webp",
            "vt-malware.webp",
            "vt-streaming.webp",
          }
          def allowed(p):
            if p in approved_source:
              return True
            path = Path(p)
            if path.parent == Path('.') and path.suffix == '.html' and p != 'static.html' and not p.startswith('static-'):
              return True
            return False

          unexpected = [p for p in changed if not allowed(p)]
          if unexpected:
            print('Unexpected Step 11.2C changes:')
            print('\n'.join(unexpected))
            sys.exit(1)

          print(f'PASS: {len(changed)} changed file(s), all inside approved Step 11.2C scope.')
          for p in changed:
            print('-', p)

      - name: Commit certified staging image refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Step 11.2C changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/service-repair.html \
                  src/pages/service-performance.html \
                  src/pages/service-upgrades.html \
                  src/pages/service-windows.html \
                  src/pages/service-security.html \
                  src/pages/streaming-support.html \
                  '*.html'
          git rm -f vt-repair.webp vt-performance.webp vt-upgrades.webp vt-windows.webp vt-malware.webp vt-streaming.webp 2>/dev/null || true
          git reset -- static.html 2>/dev/null || true
          git reset -- 'static-*.html' 2>/dev/null || true
          git commit -m "media: refresh service imagery and retire old assets"
          git push origin HEAD:clean-rebuild

      - name: Upload QA note
        if: always()
        shell: bash
        run: |
          mkdir -p qa-results/step-11.2c
          {
            echo "# VoltTech Step 11.2C — Service image refresh"
            echo
            echo "Replaced service page images with supplied WebP assets."
            echo "Removed retired root assets: vt-repair.webp, vt-performance.webp, vt-upgrades.webp, vt-windows.webp, vt-malware.webp, vt-streaming.webp"
          } > qa-results/step-11.2c/summary.md

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volttech-step-11.2c-service-images
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30
