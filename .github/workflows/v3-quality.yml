name: V3 Quality Gate

on:
  push:
    branches:
      - v3-design-polish
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generated frontend is current
        run: |
          python scripts/build-clean-frontend.py
          git diff --exit-code -- '*.html'

      - name: Run core site integrity checks
        run: python scripts/site-integrity.py