name: VoltTech Step 11.2M Image Menu Circuit Background

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2m-image-menu-circuit-bg.mjs"

permissions:
  contents: write

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2M
        run: python3 scripts/apply-step-11.2m-image-menu-circuit-bg.py

      - name: Rebuild clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify Step 11.2M contract
        run: node scripts/test-step-11.2m-image-menu-circuit-bg.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc

      - name: Guard Step 11.2M scope
        shell: python
        run: |
          import json, subprocess, sys
          from pathlib import Path
          changed = sorted(set(
              subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
              + subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).splitlines()
          ))
          approved = {
              "src/templates/header.html",
              "assets/css/navigation.css",
              "assets/css/glass-system.css",
          }
          for config_path in Path("src/pages").glob("*.json"):
              approved.add(json.loads(config_path.read_text())["output"])
          unexpected = [p for p in changed if p not in approved]
          if unexpected:
              print("\n".join(unexpected))
              sys.exit(1)
          for required in ["src/templates/header.html","assets/css/navigation.css","assets/css/glass-system.css","index.html"]:
              if required not in changed:
                  print("Missing:", required)
                  sys.exit(1)
          print("PASS: scope confirmed")

      - name: Commit certified Step 11.2M
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/header.html assets/css/navigation.css assets/css/glass-system.css
          git diff --name-only -- '*.html' | while read -r file; do
            [ -n "$file" ] && git add "$file"
          done
          git commit -m "design: add image menu and schematic circuit background"
          git push origin HEAD:clean-rebuild
