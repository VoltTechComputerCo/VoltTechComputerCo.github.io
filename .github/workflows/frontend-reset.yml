name: Frontend reset checks
on:
  workflow_dispatch:
  push:
    branches: [frontend-reset-20261005]
    paths: ['frontend/**', 'scripts/build-frontend-reset.py', 'scripts/test-frontend-reset*', 'index.html', 'design-system.html', '.github/workflows/frontend-reset.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-frontend-reset.py --check
      - run: node scripts/test-frontend-reset.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/frontend-reset-http.log 2>&1 &
      - run: node scripts/test-frontend-reset-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reset-browser-evidence
          path: qa-results/frontend-reset/
