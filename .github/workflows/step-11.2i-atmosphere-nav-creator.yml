name: VoltTech Step 11.2I Atmosphere Navigation Creator Hub

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2i-atmosphere-nav-creator.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.2i-atmosphere-nav-creator
  cancel-in-progress: true

jobs:
  refresh:
    name: Add site atmosphere, premium navigation and Creator Hub depth
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2I
        run: python3 scripts/apply-step-11.2i-atmosphere-nav-creator.py

      - name: Rebuild clean frontend
        run: python3 scripts/build-clean-frontend.py

      - name: Verify generated frontend consistency
        run: python3 scripts/build-clean-frontend.py --check

      - name: Verify Step 11.2I contract
        run: node scripts/test-step-11.2i-atmosphere-nav-creator.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc
          echo "PASS: restored regression-mutated tracked QA files"

      - name: Guard Step 11.2I scope
        shell: python
        run: |
          import json
          import subprocess
          import sys
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"], text=True
          ).splitlines()
          changed = sorted(set(tracked + untracked))

          approved = {
              "src/templates/header.html",
              "src/pages/creator-hub-south-africa.html",
              "assets/css/navigation.css",
              "assets/css/responsive.css",
              "assets/css/glass-system.css",
              "assets/css/pages/creator-hub.css",
          }

          for config_path in Path("src/pages").glob("*.json"):
              config = json.loads(config_path.read_text())
              approved.add(config["output"])

          unexpected = [p for p in changed if p not in approved]
          if unexpected:
              print("Unexpected Step 11.2I changes:")
              print("\n".join(unexpected))
              sys.exit(1)

          required = {
              "src/templates/header.html",
              "src/pages/creator-hub-south-africa.html",
              "assets/css/navigation.css",
              "assets/css/responsive.css",
              "assets/css/glass-system.css",
              "assets/css/pages/creator-hub.css",
              "creator-hub-south-africa.html",
          }
          missing = [p for p in required if p not in changed]
          if missing:
              print("Required Step 11.2I files did not change:")
              print("\n".join(missing))
              sys.exit(1)

          print(f"PASS: Step 11.2I scope confirmed ({len(changed)} files).")

      - name: Commit certified atmosphere/navigation/Creator Hub pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             src/templates/header.html             src/pages/creator-hub-south-africa.html             assets/css/navigation.css             assets/css/responsive.css             assets/css/glass-system.css             assets/css/pages/creator-hub.css

          git diff --name-only -- '*.html' | while read -r file; do
            [ -n "$file" ] && git add "$file"
          done

          git commit -m "design: add atmospheric depth and premium navigation"
          git push origin HEAD:clean-rebuild

      - name: Upload QA note
        if: always()
        shell: bash
        run: |
          mkdir -p qa-results/step-11.2i
          {
            echo "# VoltTech Step 11.2I"
            echo
            echo "- Sitewide ambient teal/purple depth behind glass surfaces."
            echo "- Technical background grid and restrained light blooms."
            echo "- Premium mobile navigation tiles with contextual subtitles."
            echo "- Stream Support navigation gets purple identity."
            echo "- Creator Hub gains a signal-stage hero visual and stronger atmosphere."
            echo "- No fake creator/live data added."
          } > qa-results/step-11.2i/summary.md

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volttech-step-11.2i-atmosphere-nav-creator
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30
