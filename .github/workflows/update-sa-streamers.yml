name: Refresh SA streamer activity

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: sa-streamer-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Build live streamer data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python3 scripts/update_streamers.py

      - name: Publish updated ranking
        run: |
          if git diff --quiet -- sa-streamers-live.json; then
            echo "No streamer data change."
            exit 0
          fi
          git config user.name "volttech-streamer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sa-streamers-live.json
          git commit -m "Refresh SA streamer activity"
          git push
