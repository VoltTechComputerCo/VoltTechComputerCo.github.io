name: STATIC Feed Autopilot

on:
  push:
    branches:
      - main
      - v2-rebuild
      - clean-rebuild
    paths:
      - "static-*.html"
      - "scripts/build-static-feed.py"
      - ".github/workflows/static-feed-autopilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Remember previous lead article
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          p=Path("static-feed.xml")
          key=""
          if p.exists():
              root=ET.fromstring(p.read_text(encoding="utf-8"))
              item=root.find("./channel/item")
              if item is not None:
                  link=(item.findtext("link") or item.findtext("guid") or "").strip()
                  key=urlparse(link).path.rstrip("/")
          Path("/tmp/static-old-lead").write_text(key,encoding="utf-8")
          PY

      - name: Build STATIC RSS from article metadata
        run: python scripts/build-static-feed.py

      - name: Prepare Discord-compatible lead image
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          feed=Path("static-feed.xml")
          root=ET.parse(feed).getroot()
          item=root.find("./channel/item")
          media=item.find("{http://search.yahoo.com/mrss/}content") if item is not None else None
          if media is None:
              raise SystemExit(0)
          url=(media.get("url") or "").strip()
          if not url.lower().endswith(".svg"):
              raise SystemExit(0)
          parsed=urlparse(url)
          rel=parsed.path.lstrip("/")
          src=Path(rel)
          if not src.exists():
              raise SystemExit(f"Lead SVG not found locally: {rel}")
          out=src.with_suffix(".discord.png")
          Path("/tmp/static-svg-source").write_text(str(src),encoding="utf-8")
          Path("/tmp/static-png-output").write_text(str(out),encoding="utf-8")
          PY

          if [ -s /tmp/static-svg-source ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq librsvg2-bin
            rsvg-convert -w 1200 "$(cat /tmp/static-svg-source)" -o "$(cat /tmp/static-png-output)"
            python - <<'PY'
            import xml.etree.ElementTree as ET
            from pathlib import Path

            feed=Path("static-feed.xml")
            tree=ET.parse(feed);root=tree.getroot()
            item=root.find("./channel/item")
            media=item.find("{http://search.yahoo.com/mrss/}content")
            old=(media.get("url") or "").strip()
            out=Path("/tmp/static-png-output").read_text(encoding="utf-8").strip()
            base="https://volttechcomputerco.co.za/"
            media.set("url",base+out)
            ET.indent(root,space="  ")
            feed.write_text(ET.tostring(root,encoding="unicode",xml_declaration=True)+"\n",encoding="utf-8")
            print(f"Discord image: {old} -> {base+out}")
            PY
          fi

      - name: Detect feed and lead changes
        id: feed
        shell: bash
        run: |
          if git diff --quiet -- static-feed.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lead_changed=false" >> "$GITHUB_OUTPUT"
            echo "STATIC feed already current."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          root=ET.fromstring(Path("static-feed.xml").read_text(encoding="utf-8"))
          item=root.find("./channel/item")
          link=(item.findtext("link") or item.findtext("guid") or "").strip() if item is not None else ""
          new=urlparse(link).path.rstrip("/")
          old=Path("/tmp/static-old-lead").read_text(encoding="utf-8").strip()
          print(f"lead_changed={'true' if new and new != old else 'false'}")
          PY

      - name: Commit feed and Discord image if changed
        if: steps.feed.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-feed.xml
          if [ -s /tmp/static-png-output ]; then
            git add "$(cat /tmp/static-png-output)"
          fi
          git commit -m "chore: rebuild STATIC RSS feed"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish new lead article to Discord
        if: github.ref_name == 'main' && steps.feed.outputs.lead_changed == 'true'
        env:
          STATIC_DISCORD_WEBHOOK: ${{ secrets.STATIC_DISCORD_WEBHOOK }}
        shell: python
        run: |
          import json,os,time,urllib.request,xml.etree.ElementTree as ET

          root=ET.parse("static-feed.xml").getroot()
          item=root.find("./channel/item")
          if item is None:
              raise SystemExit("STATIC feed contains no item")

          def get(n):
              x=item.find(n)
              return (x.text or "").strip() if x is not None else ""

          media=item.find("{http://search.yahoo.com/mrss/}content")
          current={
              "title":get("title"),
              "url":get("link"),
              "desc":get("description"),
              "image":media.get("url","").strip() if media is not None else "",
          }

          hook=(os.environ.get("STATIC_DISCORD_WEBHOOK") or "").strip()
          if not hook:
              raise SystemExit("STATIC_DISCORD_WEBHOOK is not configured")

          # Give the site/CDN a short moment to expose a newly committed raster image.
          if current["image"]:
              for _ in range(6):
                  try:
                      req=urllib.request.Request(current["image"],method="HEAD",headers={"User-Agent":"STATIC-Publisher/1.4"})
                      with urllib.request.urlopen(req,timeout=10) as r:
                          ctype=(r.headers.get("Content-Type") or "").lower()
                          if r.status < 400 and ctype.startswith("image/") and "svg" not in ctype:
                              break
                  except Exception:
                      pass
                  time.sleep(10)

          embed={
              "title":current["title"][:256],
              "url":current["url"],
              "description":current["desc"][:4096],
              "color":16757844,
              "footer":{"text":"STATIC · Tech, gaming & nerd culture"},
          }
          if current["image"]:
              embed["image"]={"url":current["image"]}

          payload={
              "username":"STATIC",
              "content":"🟠 **NEW STATIC SIGNAL**",
              "allowed_mentions":{"parse":[]},
              "embeds":[embed],
          }
          req=urllib.request.Request(
              hook+"?wait=true",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json","User-Agent":"STATIC-Publisher/1.4"},
              method="POST",
          )
          urllib.request.urlopen(req,timeout=30).read()
