name: VoltTech advertising pack
on:
  push:
    branches: [main]
    paths: ['assets/js/marketing/**', 'assets/fonts/bender.otf', 'scripts/render-ad-pack.mjs', '.github/workflows/advertising-pack.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: volttech-advertising-pack
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Render supplier product campaigns
        env:
          VT_CHROMIUM_PATH: /usr/bin/google-chrome
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m http.server 4173 > /tmp/ad-http.log 2>&1 &
          node scripts/render-ad-pack.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volttech-launch-posts
          path: assets/ads
