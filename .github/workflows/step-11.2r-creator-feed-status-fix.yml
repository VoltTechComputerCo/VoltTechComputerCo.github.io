name: VoltTech Step 11.2R Creator Hub Feed Status Fix

on:
  workflow_dispatch:
  push:
    branches:
      - clean-rebuild
    paths:
      - "scripts/run-step-11.2r-creator-feed-status-fix.mjs"

permissions:
  contents: write

concurrency:
  group: volttech-step-11.2r-creator-feed-status-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: clean-rebuild

      - name: Apply Step 11.2R
        run: python3 scripts/apply-step-11.2r-creator-feed-status-fix.py

      - name: Verify Step 11.2R contract
        run: node scripts/test-step-11.2r-creator-feed-status-fix.mjs

      - name: Run full clean regression
        run: node scripts/run-full-qa.mjs

      - name: Restore regression-mutated tracked files
        shell: bash
        run: |
          git restore --source=HEAD --worktree --staged --             qa-results/step-9.1-summary.json             qa-results/step-9.1-site-scan.json             qa-results/step-9.1-site-scan.md             scripts/__pycache__/migrate-static-history.cpython-312.pyc

      - name: Guard Step 11.2R scope
        shell: python
        run: |
          import subprocess, sys
          changed = sorted(set(
              subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
              + subprocess.check_output(["git","ls-files","--others","--exclude-standard"], text=True).splitlines()
          ))
          if changed != ["assets/js/pages/creator-hub.js"]:
              print("Expected only assets/js/pages/creator-hub.js")
              print(changed)
              sys.exit(1)
          print("PASS: exact Step 11.2R scope confirmed")

      - name: Commit certified Creator Hub status fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/pages/creator-hub.js
          git commit -m "fix: preserve Creator Hub feed status detail"
          git push origin HEAD:clean-rebuild
