name: V5 Prototype Visual QA

on:
  push:
    branches:
      - v5-clean-rebuild
    paths:
      - "v5/**"
      - ".github/workflows/v5-prototype-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-prototype-visual
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v5-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/v5/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/v5-http.log
          exit 1
      - name: Capture 360 / 390 / 1440
        run: node v5/qa/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: volttech-v5-prototype-visual
          path: v5/qa/screenshots/
          retention-days: 30
