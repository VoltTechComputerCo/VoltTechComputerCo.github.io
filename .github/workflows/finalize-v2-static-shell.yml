name: Finalize V2 Source Shell

on:
  push:
    branches:
      - v2-rebuild
    paths:
      - "scripts/finalize-v2-static-shell.py"
      - ".github/workflows/finalize-v2-static-shell.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-v2-source-shell
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2-rebuild
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v2-rebuild

      - name: Finalize V2 first-paint source
        run: python scripts/finalize-v2-static-shell.py

      - name: Check generated diff
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Commit source cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "V2 source shell is already finalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            pc-repair-pretoria.html \
            pc-performance-optimisation.html \
            pc-upgrades-pretoria.html \
            virus-malware-removal-pretoria.html \
            windows-installation-pretoria.html \
            streaming-setup-south-africa.html \
            creator-hub-south-africa.html \
            analytics.js \
            service-network.css \
            phase9-business-finish.css \
            phase9-business-finish.js

          git commit -m "refactor: make V2 layout source-first"
          git push origin HEAD:v2-rebuild
