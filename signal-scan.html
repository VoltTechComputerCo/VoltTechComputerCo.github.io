<style>
.scanwrap{width:min(620px,100%);margin:auto;padding:28px 16px 60px}.scanbrand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.scanbrand img{height:30px}.back{font:10px var(--mono);color:var(--muted)}.scope{height:90px;background:var(--panel);border:1px solid var(--line);border-radius:5px;position:relative;overflow:hidden;margin:18px 0}.scope canvas{width:100%;height:100%}.scope span{position:absolute;top:8px;font:9px var(--mono);letter-spacing:.1em}#scopeLabel{left:10px;color:var(--teal)}#scopeRead{right:10px;color:var(--muted)}.meter{display:flex;gap:4px;margin:0 0 18px}.seg{flex:1;height:3px;background:var(--line)}.seg.on{background:var(--teal);box-shadow:0 0 8px var(--teal)}.scanpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:25px;min-height:390px}.scanpanel h1,.scanpanel h2{margin-top:0}.options{display:grid;gap:10px}.opt{text-align:left;background:var(--bg2);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:4px;font:500 14px var(--display);cursor:pointer}.opt:hover{border-color:var(--teal2)}.fields{display:grid;gap:13px}label{display:block;font:9px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}input{width:100%;padding:13px;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:4px;font:14px var(--display)}.scannav{display:flex;gap:8px;margin-top:22px}.result{font:700 31px var(--mono);color:var(--teal);margin:16px 0 2px}.resultnote{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0;font:11px var(--mono);color:var(--muted)}.row span:last-child{color:var(--text);text-align:right}.badge{display:inline-flex;padding:5px 9px;border:1px solid var(--teal2);border-radius:99px;font:9px var(--mono);color:var(--teal);margin:0 0 12px}.warn{color:var(--amber);border-color:#60441c}.danger{color:var(--danger);border-color:#5a2521}.privacyhint{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:500px){.scanbrand small{display:none}}

<body><div class="scanwrap">
<div class="scanbrand"><a class="brand" href="index.html"><img src="logo-badge.png" alt="VoltTech logo"><span><b>Volt</b>Tech <b>Computer Co.</b></span></a><small class="muted">PRETORIA / WONDERBOOM</small></div>
<a class="back" href="index.html">← BACK TO VOLTTECH</a>
<div class="scope"><span id="scopeLabel">SIGNAL SCAN</span><span id="scopeRead">STABLE</span><canvas id="scope"></canvas></div>
<div class="meter" id="meter"></div><div class="scanpanel" id="panel"></div>
</div>
<script>
const P='27618435775', E='volttechcomputerco@gmail.com';
const state={symptom:null,duration:null,age:null,usage:null,name:'',phone:'',email:''};let step=0;
const symptoms=[
{id:'slow',label:'It is running very slowly'},{id:'noboot',label:'It will not turn on or boot'},{id:'heat',label:'It gets hot or the fans are very loud'},{id:'bsod',label:'It crashes, freezes or shows a blue screen'},{id:'virus',label:'I see pop-ups, redirects or suspicious behaviour'},{id:'upgrade',label:'It works, I just want it to feel faster'}];
const durations=[['today','It started today'],['days','A few days'],['weeks','A few weeks'],['months','A few months or longer']];
const ages=[['new','Under 2 years'],['mid','2–5 years'],['old','More than 5 years'],['unknown','I am not sure']];
const usages=[['daily','Everyday use / work / school'],['gaming','Gaming'],['creation','Creative / engineering work'],['unsure','I am not sure']];
const diag={
slow:{name:'General performance slowdown',detail:'Common causes include too many startup apps, storage problems, low memory or overheating.',low:300,high:550,urg:'low'},
noboot:{name:'Boot or power problem',detail:'This can be anything from a loose or failed component to a damaged boot drive, so hands-on diagnostics matter.',low:250,high:650,urg:'high'},
heat:{name:'Cooling or airflow problem',detail:'Dust, dried thermal paste, poor airflow or a failing fan are common possibilities.',low:350,high:650,urg:'mid'},
bsod:{name:'System instability',detail:'Drivers, memory, storage, heat or power issues can all cause crashes and blue screens.',low:350,high:700,urg:'high'},
virus:{name:'Possible malware or unwanted software',detail:'Suspicious behaviour should be checked before using the PC for sensitive logins.',low:450,high:750,urg:'high'},
upgrade:{name:'Performance upgrade opportunity',detail:'A health check can show whether an SSD, RAM or another targeted upgrade is likely to make a real difference.',low:300,high:600,urg:'low'}
};
function meter(){document.getElementById('meter').innerHTML=[1,2,3,4,5].map(i=>`<div class="seg ${step>=i?'on':''}"></div>`).join('')}
function opts(items,key,next){return `<div class="options">${items.map(x=>{let id=x.id||x[0],label=x.label||x[1];return `<button class="opt" onclick="pick('${key}','${id}',${next})">${label}</button>`}).join('')}</div>`}
function pick(k,v,n){state[k]=v;step=n;render()}
function back(n){step=n;render()}
function render(){meter();const p=document.getElementById('panel');
if(step===0)p.innerHTML=`<div class="eyebrow">// FREE · ABOUT 60 SECONDS</div><h1>Tell us what your PC is doing.</h1><p class="lead">No technical knowledge needed. Signal Scan uses your symptoms to give you a likely problem category and a realistic service estimate.</p><div class="panel"><strong>Important:</strong><p>This is a symptom-based estimate, not a remote hardware test. Replacement parts are never included in the estimate below and are quoted separately if needed.</p></div><div class="scannav"><button class="btn primary" onclick="step=1;render();vtTrack('signal_scan_start')">Begin scan →</button></div>`;
if(step===1)p.innerHTML=`<div class="eyebrow">STEP 1 / 5</div><h2>Which description sounds closest?</h2>${opts(symptoms,'symptom',2)}<div class="scannav"><button class="btn ghost" onclick="back(0)">← Back</button></div>`;
if(step===2)p.innerHTML=`<div class="eyebrow">STEP 2 / 5</div><h2>How long has it been happening?</h2>${opts(durations,'duration',3)}<div class="scannav"><button class="btn ghost" onclick="back(1)">← Back</button></div>`;
if(step===3)p.innerHTML=`<div class="eyebrow">STEP 3 / 5</div><h2>Roughly how old is the PC?</h2>${opts(ages,'age',4)}<div class="scannav"><button class="btn ghost" onclick="back(2)">← Back</button></div>`;
if(step===4)p.innerHTML=`<div class="eyebrow">STEP 4 / 5</div><h2>What do you mainly use it for?</h2>${opts(usages,'usage',5)}<div class="scannav"><button class="btn ghost" onclick="back(3)">← Back</button></div>`;
if(step===5)p.innerHTML=`<div class="eyebrow">STEP 5 / 5</div><h2>Optional contact details</h2><p class="muted">You can see your result without giving us your details. Add them only if you want your WhatsApp/email message pre-filled.</p><div class="fields"><div><label>Name</label><input id="n" placeholder="Your name"></div><div><label>Phone / WhatsApp</label><input id="ph" placeholder="082 123 4567"></div><div><label>Email (optional)</label><input id="em" placeholder="you@example.com"></div></div><p class="privacyhint">We do not submit this form to a server. The details are only used to build the message you choose to send.</p><div class="scannav"><button class="btn ghost" onclick="back(4)">← Back</button><button class="btn primary" onclick="finish()">See my result →</button></div>`;
if(step===6)result();}
function finish(){state.name=(document.getElementById('n').value||'').trim();state.phone=(document.getElementById('ph').value||'').trim();state.email=(document.getElementById('em').value||'').trim();step=6;vtTrack('signal_scan_complete',{symptom:state.symptom});render()}
function result(){const d=diag[state.symptom]||diag.slow;const s=symptoms.find(x=>x.id===state.symptom)?.label||'';let cls=d.urg==='high'?'badge danger':d.urg==='mid'?'badge warn':'badge';let bt=d.urg==='high'?'ATTEND SOON':d.urg==='mid'?'MODERATE PRIORITY':'LOW URGENCY';document.getElementById('panel').innerHTML=`<div class="eyebrow">SCAN COMPLETE</div><h2>${d.name}</h2><div class="${cls}">${bt}</div><p class="lead">${d.detail}</p><div class="row"><span>Symptom</span><span>${s}</span></div><div class="row"><span>Timeframe</span><span>${durations.find(x=>x[0]===state.duration)?.[1]||'—'}</span></div><div class="row"><span>PC age</span><span>${ages.find(x=>x[0]===state.age)?.[1]||'—'}</span></div><div class="result">R${d.low} – R${d.high}</div><div class="resultnote">Likely service/labour range only · replacement parts quoted separately after diagnosis</div><div class="signal"><h3>Want VoltTech to take it from here?</h3><p>Your message will include the scan result so you do not need to explain everything again.</p><div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${wa(d,s)}">Send result on WhatsApp</a><a class="btn ghost" href="${mail(d,s)}">Email result</a></div></div><button class="btn ghost" onclick="step=0;render()">Run another scan</button>`}
function enc(x){return encodeURIComponent(x||'')}
function wa(d,s){let m=`Hi VoltTech! I ran Signal Scan.\n\nName: ${state.name||'Not provided'}\nProblem: ${s}\nLikely category: ${d.name}\nEstimated service range: R${d.low}–R${d.high} (parts excluded)\n\nI'd like help with the next step.`;return `https://wa.me/${P}?text=${enc(m)}`}
function mail(d,s){let b=`Name: ${state.name||'Not provided'}\nPhone: ${state.phone||'Not provided'}\nProblem: ${s}\nLikely category: ${d.name}\nEstimated service range: R${d.low}–R${d.high} (parts excluded)`;return `mailto:${E}?subject=${enc('Signal Scan result — '+d.name)}&body=${enc(b)}`}
const c=document.getElementById('scope'),x=c.getContext('2d');let t=0;function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio}size();addEventListener('resize',size);function draw(){let w=c.width,h=c.height;x.clearRect(0,0,w,h);x.beginPath();x.strokeStyle='#2fe6c8';x.lineWidth=1.4*devicePixelRatio;x.shadowColor='#2fe6c8';x.shadowBlur=6;for(let i=0;i<w;i+=3){let y=h/2+Math.sin(i*.018+t)*7*devicePixelRatio+(step>0?(Math.random()-.5)*step*2:0);i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();t+=.05;requestAnimationFrame(draw)}draw();render();
</script></body></html>
