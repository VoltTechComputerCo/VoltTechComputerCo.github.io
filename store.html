<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PC Parts Store Coming Soon | VoltTech Computer Co.</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#05080a">
  <link rel="icon" href="favicon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at 50% 20%,rgba(47,230,200,.12),transparent 38%),
        #05080a;
      color:#edf7f4;
      font-family:'Space Grotesk',sans-serif;
    }
    .card{
      width:min(480px,100%);
      padding:34px 24px;
      text-align:center;
      border:1px solid rgba(47,230,200,.35);
      border-radius:12px;
      background:rgba(10,18,19,.94);
      box-shadow:0 24px 70px rgba(0,0,0,.45);
    }
    img{height:38px;width:auto;margin-bottom:24px}
    h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1.05;letter-spacing:-.04em}
    h1 span{color:#2fe6c8}
  </style>
</head>
<body>
  <main class="card">
    <img src="brand/VoltTech_Full_Logo_Transparent.png" alt="VoltTech Computer Co.">
    <h1>PC Parts Store <span>coming soon.</span></h1>
  </main>
</body>
</html>
