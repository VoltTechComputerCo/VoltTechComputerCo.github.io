<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltTech Admin | Quote Builder</title><meta name="robots" content="noindex,nofollow"><style>:root{--b:#05090a;--p:#0b1515;--l:#203533;--t:#2fe6c8;--x:#edf7f4;--m:#829995;--r:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--x);font-family:system-ui}.w{width:min(1000px,100%);margin:auto;padding:16px}nav{border-bottom:1px solid var(--l)}.nav{display:flex;justify-content:space-between;align-items:center}a{color:var(--t);text-decoration:none}h1{font-size:28px;margin:28px 0 5px}.muted{color:var(--m)}.card{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:10px;text-transform:uppercase;margin-bottom:6px}input,select,textarea{width:100%;background:#07100f;color:var(--x);border:1px solid #29413e;border-radius:5px;padding:11px}textarea{min-height:80px}.item{border-top:1px solid var(--l);padding:14px 0}.itemgrid{display:grid;grid-template-columns:2fr .7fr 1fr 1fr;gap:8px}.supplier{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.btn{border:1px solid var(--t);background:transparent;color:var(--t);padding:11px 14px;border-radius:5px;font-weight:700}.primary{background:var(--t);color:#04120f}.danger{border-color:#684040;color:#ff9b9b}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.summary{display:flex;justify-content:space-between;border-top:1px solid var(--l);padding-top:14px;margin-top:14px}.summary b{color:var(--t);font-size:20px}.quote{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--l)}.quote small{color:var(--m)}#status{font-size:12px;color:var(--m)}@media(max-width:650px){.grid,.itemgrid,.supplier{grid-template-columns:1fr}.full{grid-column:auto}.quote{align-items:flex-start}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="admin.js"></script></head><body><nav><div class="w nav"><b>VoltTech · Admin</b><a href="account.html">Customer account</a></div></nav><main class="w"><h1>Quote Builder</h1><p class="muted">Create and send customer quotations from your phone.</p><section id="denied" class="card" hidden><b>Admin access required.</b><p class="muted">This account is not authorised to manage VoltTech quotes.</p></section><div id="app" hidden><form id="quoteForm" class="card"><div class="grid"><div><label>Customer</label><select id="customer" required></select></div><div><label>Quote type</label><select id="type"><option value="repair">Repair</option><option value="service">Service</option><option value="stream_optimisation">Stream optimisation</option><option value="parts">Parts</option><option value="system_build">System build</option><option value="other">Other</option></select></div><div class="full"><label>Quote title</label><input id="title" required placeholder="e.g. Gaming PC repair — GPU diagnosis"></div><div><label>Valid until</label><input id="valid" type="date" required></div><div><label>Delivery / collection fee (R)</label><input id="delivery" type="number" min="0" step=".01" value="0"></div><div><label>Discount (R)</label><input id="discount" type="number" min="0" step=".01" value="0"></div><div class="full"><label>Customer note</label><textarea id="customerNote" placeholder="Shown to the customer"></textarea></div><div class="full"><label>Internal note</label><textarea id="internalNote" placeholder="VoltTech only"></textarea></div></div><h3>Line items</h3><div id="items"></div><div class="row"><button type="button" class="btn" id="add">+ Add item</button></div><div class="summary"><span>Quote total</span><b id="total">R0.00</b></div><div class="row"><button class="btn primary" type="submit">Create draft quote</button></div></form><section class="card"><h2>Recent quotes</h2><div id="recent"></div></section></div><p id="status"></p></main></body></html>
