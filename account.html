<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | VoltTech Computer Co.</title><meta name="robots" content="noindex,follow"><link rel="icon" href="favicon-512.png"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#05080a;--panel:#0d1517;--line:#172526;--teal:#2fe6c8;--text:#e7f1ee;--muted:#6f8985;--danger:#ff7272;--mono:'JetBrains Mono',monospace;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 80% 45% at 50% -10%,#0c2320,transparent 60%),var(--bg);color:var(--text);font-family:var(--display);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(720px,100%);margin:auto;padding:0 20px}nav{border-bottom:1px solid var(--line);background:rgba(5,8,10,.94)}nav .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{height:34px}.brand span{font:700 12px var(--mono)}.brand b{color:var(--teal)}.back{font:10px var(--mono);color:var(--teal);text-transform:uppercase}main{padding:58px 0 80px}.eyebrow{font:10px var(--mono);color:var(--teal);letter-spacing:.14em;text-transform:uppercase}h1{font-size:38px;line-height:1.08;margin:14px 0 9px}.lead{color:var(--muted);margin:0 0 28px}.card{border:1px solid var(--line);border-radius:8px;background:rgba(13,21,23,.96);padding:26px}.google{width:100%;min-height:52px;border:1px solid #747775;border-radius:5px;background:#fff;color:#1f1f1f;font:600 14px var(--display);display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}.google svg{width:20px;height:20px;flex:none}.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font:9px var(--mono);margin:22px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}label{display:block;font:10px var(--mono);color:#9bb0ac;margin:14px 0 7px;text-transform:uppercase}input{width:100%;height:48px;border:1px solid #263633;border-radius:4px;background:#08100f;color:var(--text);padding:0 13px;font:14px var(--display);outline:none}input:focus{border-color:var(--teal)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{min-height:48px;border:1px solid var(--teal);border-radius:4px;background:transparent;color:var(--teal);font:700 10px var(--mono);text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--teal);color:#04120f}.btn:disabled{opacity:.7;cursor:wait}#signedOutStatus,#signedInStatus{min-height:20px;margin-top:16px;font:10px var(--mono);color:var(--muted)}#signedOutStatus[data-type=error],#signedInStatus[data-type=error]{color:var(--danger)}#signedOutStatus[data-type=success],#signedInStatus[data-type=success]{color:var(--teal)}.profile{display:flex;align-items:center;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}.avatar{width:48px;height:48px;border-radius:50%}.profile h2{font-size:20px;margin:0}.profile p{margin:3px 0 0;color:var(--muted);font-size:13px}.profile-form{padding-top:8px}.profile-form h3{font-size:16px;margin:18px 0 2px}.profile-form .hint{font-size:12px;color:var(--muted);margin:0 0 8px}.save{width:100%;margin-top:18px}.signout{width:100%;margin-top:10px;border-color:#33433f;color:#9bb0ac}@media(max-width:560px){main{padding-top:40px}h1{font-size:31px}.card{padding:21px 17px}.actions{grid-template-columns:1fr}.brand span{display:none}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="account.js"></script></head><body><nav><div class="wrap"><a class="brand" href="index.html"><img src="logo-badge.png" alt="VoltTech Computer Co."><span><b>Volt</b>Tech Computer Co.</span></a><a class="back" href="index.html">← Home</a></div></nav><main><div class="wrap"><div class="eyebrow">// VOLTTECH ACCOUNT</div><h1>Your VoltTech account.</h1><p class="lead">Sign in to manage your VoltTech account.</p><section class="card" id="signedOut"><button class="google" id="googleSignIn" type="button" aria-label="Continue with Google"><svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.879 2.684-6.613z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.182l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.963 10.705A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.168.281-1.705V4.963H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.037l3.007-2.332z"/><path fill="#EA4335" d="M9 3.581c1.322 0 2.508.454 3.441 1.346l2.581-2.581C13.463.892 11.425 0 9 0A9 9 0 0 0 .956 4.963l3.007 2.332C4.672 5.166 6.656 3.581 9 3.581z"/></svg><span>Continue with Google</span></button><div class="divider">OR USE EMAIL</div><form id="emailAuth"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><div class="actions"><button class="btn primary" type="submit" value="signin">Sign in</button><button class="btn" type="submit" value="signup">Create account</button></div></form><p id="signedOutStatus" role="status" aria-live="polite"></p></section><section class="card" id="signedIn" hidden><div class="profile"><img class="avatar" id="accountAvatar" alt="" hidden><div><h2 id="accountName">VoltTech customer</h2><p id="accountEmail"></p></div></div><form class="profile-form" id="profileForm"><h3>Profile</h3><p class="hint">Keep your contact details up to date.</p><label for="profileName">Name</label><input id="profileName" type="text" autocomplete="name" maxlength="120"><label for="profilePhone">Phone / WhatsApp</label><input id="profilePhone" type="tel" autocomplete="tel" maxlength="40"><label for="profileSuburb">Suburb</label><input id="profileSuburb" type="text" autocomplete="address-level3" maxlength="120"><button class="btn primary save" id="saveProfile" type="submit">Save profile</button></form><button class="btn signout" id="signOut" type="button">Sign out</button><p id="signedInStatus" role="status" aria-live="polite"></p></section></div></main></body></html>
